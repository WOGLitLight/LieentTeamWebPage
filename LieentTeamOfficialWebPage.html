<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lieent Team Official</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background:
                linear-gradient(
                    135deg,
                    #B7B8EA 0%,
                    #B7B8EA 25%,
                    #FB9794 25%,
                    #FB9794 50%,
                    #B7B8EA 50%,
                    #B7B8EA 75%,
                    #FB9794 75%,
                    #FB9794 100%
                );

            background-size: 120px 120px;

            font-family:
                system-ui,
                'Segoe UI',
                'Roboto',
                'Helvetica Neue',
                sans-serif;

            color: #1e2a3e;

            padding: 2rem 1.5rem 4rem;

            line-height: 1.5;
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
            text-align: center;
        }

        .logo-img,
        .discord-img {
            width: 100%;
            max-width: 600px;
            height: auto;

            border-radius: 1.5rem;

            box-shadow:
                0 10px 24px rgba(0,0,0,0.18);

            margin-top: 1rem;
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 3rem;

            margin-bottom: 1rem;

            font-weight: 900;

            background:
                linear-gradient(
                    135deg,
                    #3337C3,
                    #EAEAEA,
                    #F51A13
                );

            -webkit-background-clip: text;
            background-clip: text;

            color: transparent;
        }

        .button-area {
            display: flex;

            justify-content: center;

            margin-bottom: 2.2rem;
        }

        .main-btn {
            border: none;

            color: white;

            font-weight: bold;

            font-size: 1rem;

            padding: 0.85rem 1.8rem;

            border-radius: 2rem;

            cursor: pointer;

            transition:
                transform 0.2s ease,
                box-shadow 0.2s ease;

            box-shadow:
                0 6px 16px rgba(0,0,0,0.18);
        }

        .main-btn:hover {
            transform: translateY(-3px);

            box-shadow:
                0 10px 22px rgba(0,0,0,0.24);
        }

        .mods-btn {
            background:
                linear-gradient(
                    135deg,
                    #3337C3,
                    #EAEAEA,
                    #F51A13
                );
        }

        .discord-btn {
            background:
                linear-gradient(
                    135deg,
                    #5566FB,
                    #7788FF
                );
        }

        .section {
            margin-bottom: 3rem;
        }

        .section-title {
            font-size: 1.4rem;

            font-weight: bold;

            margin-bottom: 0.8rem;

            color: #2c3760;
        }

        @media (max-width: 640px) {

            body {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            .main-btn {
                width: 100%;
                max-width: 320px;
            }
        }
    </style>
</head>

<body>

    <div class="container">

        <!-- 标题 -->
        <div class="section">

            <h1>Welcome To Lieent Team</h1>

            <img
                class="logo-img"
                src="https://woglitlight.github.io/LieentTeamWebPage/lieent_logo_HD.png"
                alt="Lieent Team Logo"
            >

            <div class="button-area">

                <button
                    class="main-btn mods-btn"
                    onclick="window.open(
                        'https://woglitlight.github.io/LieentTeamWOGModsWebPage/LieentTeamWOGModsWebPage.html',
                        '_blank'
                    )"
                >
                    🎮 Visit Lieent Team's WOG Mods
                </button>

            </div>

        </div>

        <!-- Discord -->
        <div class="section">

            <div class="section-title">
                Join Our Discord Server
            </div>

            <img
                class="discord-img"
                src="https://woglitlight.github.io/LieentTeamWebPage/lieent_discord_sever.png"
                alt="Lieent Discord Server"
            >

            <div class="button-area">

                <button
                    class="main-btn discord-btn"
                    onclick="window.open(
                        'https://discord.gg/desaedU5GX',
                        '_blank'
                    )"
                >
                    💬 Join Our Discord Server
                </button>

            </div>

        </div>

    </div>

</body>
</html>
